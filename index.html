<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniiDex - Registro de Aniimos (Imagens Reais)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#020617 0%,#0f172a 50%,#1e1b4b 100%);color:#e2e8f0;min-height:100vh}.container{max-width:1200px;margin:0 auto;padding:20px;position:relative;z-index:1}.header{text-align:center;margin-bottom:30px}.header-content{display:inline-flex;align-items:center;gap:12px}.logo{width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#9333ea);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 30px rgba(99,102,241,0.3)}.title{font-size:2.5rem;font-weight:900;background:linear-gradient(to right,#a5b4fc,#d8b4fe,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.subtitle{font-size:0.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}.stat-card{border-radius:12px;padding:16px;text-align:center;border:1px solid}.stat-card.indigo{background:linear-gradient(135deg,rgba(49,46,129,0.4),rgba(88,28,135,0.4));border-color:rgba(99,102,241,0.3)}.stat-card.emerald{background:linear-gradient(135deg,rgba(6,78,59,0.4),rgba(17,94,89,0.4));border-color:rgba(16,185,129,0.3)}.stat-card.rose{background:linear-gradient(135deg,rgba(136,19,55,0.4),rgba(157,23,77,0.4));border-color:rgba(244,63,94,0.3)}.stat-number{font-size:1.8rem;font-weight:700;color:white}.stat-label{font-size:0.7rem;margin-top:4px}.stat-card.indigo .stat-label{color:#a5b4fc}.stat-card.emerald .stat-label{color:#6ee7b7}.stat-card.rose .stat-label{color:#fda4af}.controls{margin-bottom:24px}.search-input{width:100%;padding:12px 16px;background:rgba(30,41,59,0.6);border:1px solid rgba(51,65,85,0.5);border-radius:12px;color:white;font-size:1rem;outline:none;margin-bottom:12px}.search-input:focus{border-color:rgba(99,102,241,0.5);box-shadow:0 0 0 3px rgba(99,102,241,0.1)}.search-input::placeholder{color:#64748b}.filter-label{font-size:0.75rem;color:#64748b;font-weight:500;margin-right:8px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.filter-btn{padding:6px 12px;border-radius:8px;font-size:0.75rem;font-weight:500;cursor:pointer;border:1px solid rgba(51,65,85,0.3);background:rgba(30,41,59,0.4);color:#94a3b8;transition:all 0.2s}.filter-btn:hover{color:white;border-color:rgba(100,116,139,0.5)}.filter-btn.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{border-radius:16px;overflow:hidden;transition:transform 0.3s;border:2px solid rgba(51,65,85,0.4);background:linear-gradient(135deg,rgba(30,41,59,0.6),rgba(15,23,42,0.6))}.card:hover{transform:scale(1.02)}.card.complete{border-color:rgba(250,204,21,0.6);background:linear-gradient(135deg,rgba(88,28,135,0.4),rgba(49,46,129,0.4))}.card.captured{border-color:rgba(16,185,129,0.4)}.card-header{padding:16px 16px 8px}.card-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.badge{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:999px}.badge-id{background:rgba(51,65,85,0.5);color:#94a3b8}.badge-element{border:1px solid}.card-name{font-size:1.2rem;font-weight:700;color:white;margin-top:8px}.progress-bar{display:flex;align-items:center;gap:8px;margin-top:6px}.progress-track{flex:1;height:6px;background:#334155;border-radius:999px;overflow:hidden}.progress-fill{height:100%;border-radius:999px;transition:width 0.5s}.progress-fill.complete{background:linear-gradient(to right,#facc15,#f59e0b)}.progress-fill.partial{background:linear-gradient(to right,#34d399,#14b8a6)}.progress-text{font-size:0.75rem;color:#94a3b8}.card-image{padding:8px 16px;position:relative}.image-wrapper{border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#1e293b}.image-wrapper img{width:100%;height:140px;object-fit:contain;padding:8px;transition:all 0.3s ease;display:block}.image-wrapper.uncaptured img{filter:grayscale(1);opacity:0.4}.image-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.2);pointer-events:none}.image-overlay span{font-size:0.875rem;color:#94a3b8;background:rgba(15,23,42,0.8);padding:4px 12px;border-radius:999px}.form-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:0.7rem;font-weight:600;color:white;background:rgba(0,0,0,0.8);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;backdrop-filter:blur(4px);z-index:10}.card-forms{padding:8px 16px 16px}.forms-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 0;background:none;border:none;color:#cbd5e1;font-size:0.875rem;font-weight:500;cursor:pointer}.forms-toggle:hover{color:white}.forms-toggle svg{transition:transform 0.3s}.forms-toggle.expanded svg{transform:rotate(180deg)}.forms-list{margin-top:8px;display:none}.forms-list.show{display:block}.form-item{border-radius:12px;padding:12px;margin-bottom:8px;transition:all 0.3s;border:1px solid rgba(51,65,85,0.3);background:rgba(30,41,59,0.4);cursor:pointer}.form-item:hover{border-color:rgba(100,116,139,0.5);background:rgba(30,41,59,0.6)}.form-item.captured{background:rgba(6,78,59,0.2);border-color:rgba(16,185,129,0.3)}.form-item.selected{border-color:rgba(168,85,247,0.6);background:rgba(168,85,247,0.1);box-shadow:0 0 12px rgba(168,85,247,0.2)}.form-header{display:flex;align-items:center;gap:8px}.checkbox-wrapper{position:relative;flex-shrink:0}.checkbox-wrapper input{position:absolute;opacity:0;width:0;height:0}.checkbox-custom{width:20px;height:20px;border-radius:4px;border:2px solid #64748b;display:flex;align-items:center;justify-content:center;transition:all 0.2s;cursor:pointer}.checkbox-wrapper input:checked+.checkbox-custom{border-color:#34d399;background:#10b981}.checkbox-custom svg{display:none}.checkbox-wrapper input:checked+.checkbox-custom svg{display:block}.form-name{font-size:0.875rem;font-weight:600;color:#cbd5e1;flex:1}.form-item.captured .form-name{color:#6ee7b7}.form-item.selected .form-name{color:#d8b4fe}.form-category{font-size:0.625rem;font-weight:700;padding:2px 6px;border-radius:999px;text-transform:uppercase;border:1px solid;flex-shrink:0}.view-btn{font-size:0.625rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid rgba(168,85,247,0.4);background:rgba(168,85,247,0.1);color:#d8b4fe;cursor:pointer;transition:all 0.2s;flex-shrink:0}.view-btn:hover{background:rgba(168,85,247,0.2);border-color:rgba(168,85,247,0.6)}.form-info{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.form-tag{font-size:0.7rem;color:#94a3b8;background:rgba(51,65,85,0.5);padding:2px 8px;border-radius:999px}.star{color:#facc15;font-size:1.2rem;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}.footer{text-align:center;margin-top:60px;padding-bottom:30px;color:#475569;font-size:0.875rem}.footer a{color:#818cf8;text-decoration:underline}@media(max-width:768px){.title{font-size:1.8rem}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat-card{padding:12px 8px}.stat-number{font-size:1.4rem}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card-name{font-size:1rem}.image-wrapper img{height:120px}.form-item{padding:10px}.form-name{font-size:0.75rem}.form-category{font-size:0.6rem}.view-btn{font-size:0.6rem;padding:2px 6px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card-header{padding:12px 12px 6px}.card-image{padding:6px 12px}.card-forms{padding:6px 12px 12px}.image-wrapper img{height:100px}}.bg-effect{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.bg-blob{position:absolute;border-radius:50%;filter:blur(80px);animation:float 8s ease-in-out infinite}.bg-blob-1{top:25%;left:-80px;width:300px;height:300px;background:rgba(139,92,246,0.1)}.bg-blob-2{bottom:25%;right:-80px;width:400px;height:400px;background:rgba(99,102,241,0.1);animation-delay:2s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
</style>
</head>
<body>
<div class="bg-effect"><div class="bg-blob bg-blob-1"></div><div class="bg-blob bg-blob-2"></div></div>
<div class="container">
<header class="header"><div class="header-content"><div class="logo">🔮</div><div><h1 class="title">AniiDex</h1><p class="subtitle">Sistema de Registro de Aniimos • Imagens Reais</p></div></div></header>
<div class="stats" id="stats"></div>
<div class="controls">
<input type="text" class="search-input" id="search" placeholder="🔍 Buscar Aniimo por nome...">
<div class="filters"><span class="filter-label">Elemento:</span><div id="element-filters"></div></div>
<div class="filters"><span class="filter-label">Região:</span><select id="habitat-filter" class="filter-btn" style="padding:6px 12px;cursor:pointer"><option value="all">Todas as Regiões</option></select></div>
</div>
<div class="grid" id="grid"></div>
<footer class="footer"><p>AniiDex © 2026 — Dados e imagens baseados no jogo <a href="https://www.aniimo.com/pt/" target="_blank">Aniimo</a></p><p style="margin-top:4px;font-size:0.7rem;">💡 Clique em "Ver" para ver o Aniimo em cada forma com imagem real!</p></footer>
</div>
<script>
// Base URL das imagens reais do AniimoTools
const IMG_BASE = "https://aniimotools.dev/assets/creatures/";
const avatar = name => `${IMG_BASE}avatar/${name.toLowerCase()}.webp`;
const form = (name, num) => `${IMG_BASE}forms/${name.toLowerCase()}-${num}-c.webp`;
const special = (name, code) => `${IMG_BASE}forms/${name.toLowerCase()}-a${code}-c.webp`;

const elementColors={"Fogo":"#FF6B35","Água":"#4FC3F7","Planta":"#66BB6A","Sombrio":"#7E57C2","Vento":"#80DEEA","Terra":"#A1887F","Gelo":"#B3E5FC","Raio":"#FFD54F"};
const habitatClimate={"Campos de Nimbus":{climate:"Ensolarado",icon:"☀️"},"Crista da Presa Bestial":{climate:"Ventoso Frio",icon:"🌬️"},"Estreito Argênteo":{climate:"Litorâneo",icon:"🌊"},"Baía Crescente":{climate:"Tropical Úmido",icon:"🌴"},"Pouso do Eco":{climate:"Nebuloso",icon:"🌫️"},"Caminho Berilo":{climate:"Temperado Seco",icon:"🏜️"},"Floresta das Estrelas Cadentes":{climate:"Noturno Místico",icon:"🌙"},"Bosques Nebulosos":{climate:"Névoa Úmida",icon:"🌲"},"Bosque da Torre de Rosas":{climate:"Floresta Densa",icon:"🌹"},"Mar de Flores":{climate:"Primavera Eterna",icon:"🌸"},"Bosque Relâmpago":{climate:"Tempestade Elétrica",icon:"⚡"},"Ponte Terrestre de Zéfiro":{climate:"Árido Vulcânico",icon:"🌋"},"Planaltos Rubros":{climate:"Altitude Fria",icon:"🏔️"},"Costa das Flores da Maré":{climate:"Costa Tempestuosa",icon:"🌊"},"Prado Derivante":{climate:"Neblina Gelada",icon:"❄️"}};

function mkForm(aid,name,cat,hab,image){const f={id:`${aid}-${name.toLowerCase().replace(/\s+/g,'-')}`,name,category:cat,image};if(hab&&habitatClimate[hab]){f.region=hab;f.climate=habitatClimate[hab].climate;f.climateIcon=habitatClimate[hab].icon}return f}
const bf=(id,name,img)=>({id:`${id}-forma-basica`,name:"Forma Básica",category:"basica",image:img});
const pf=(id,name,img)=>({id:`${id}-forma-prismana`,name:"Forma Prismana",category:"prismana",image:img});

// ANIIMOS COM IMAGENS REAIS (Exemplo com primeiros 10 Aniimos)
const aniimos=[
{id:1,name:"Emberpup",elements:["Fogo"],habitats:["Campos de Nimbus","Bosques Nebulosos","Estreito Argênteo","Pouso do Eco","Crista da Presa Bestial"],forms:[
bf("001","Emberpup",avatar("emberpup")),
mkForm("001","Forma das Terras Altas","regional","Campos de Nimbus",form("emberpup",2)),
mkForm("001","Forma da Floresta Montanhosa","regional","Crista da Presa Bestial",form("emberpup",3))
]},
{id:2,name:"Flameruff",elements:["Fogo"],habitats:["Campos de Nimbus","Estreito Argênteo","Pouso do Eco","Crista da Presa Bestial"],forms:[
bf("002","Flameruff",avatar("flameruff")),
mkForm("002","Forma das Terras Altas","regional","Campos de Nimbus",form("flameruff",2)),
mkForm("002","Forma da Floresta Montanhosa","regional","Crista da Presa Bestial",form("flameruff",3))
]},
{id:3,name:"Scorchhowl",elements:["Fogo"],habitats:["Crista da Presa Bestial"],forms:[
bf("003","Scorchhowl",avatar("scorchhowl")),
mkForm("003","Forma das Terras Altas","regional","Crista da Presa Bestial",form("scorchhowl",2)),
mkForm("003","Forma da Floresta Montanhosa","regional","Crista da Presa Bestial",form("scorchhowl",3)),
pf("003","Scorchhowl",special("scorchhowl","1005303")),
mkForm("003","Forma Arco-Umbral","regional","Crista da Presa Bestial",form("scorchhowl",4)),
mkForm("003","Forma da Tempestade","climatica",special("scorchhowl","1005302"))
]},
{id:4,name:"Inferlupa",elements:["Fogo","Sombrio"],habitats:[],forms:[
bf("004","Inferlupa",avatar("inferlupa")),
pf("004","Inferlupa",special("inferlupa","1005503"))
]},
{id:5,name:"Celestis",elements:["Sombrio"],habitats:["Campos de Nimbus","Estreito Argênteo","Pouso do Eco","Floresta das Estrelas Cadentes"],forms:[
bf("005","Celestis",avatar("celestis"))
]},
{id:6,name:"Stellarys",elements:["Sombrio"],habitats:["Floresta das Estrelas Cadentes"],forms:[
bf("006","Stellarys",avatar("stellarys")),
pf("006","Stellarys",special("stellarys","1001202")),
mkForm("006","Forma Arco-Umbral","regional","Floresta das Estrelas Cadentes",form("stellarys",2)),
mkForm("006","Forma da Chuva Torrencial","climatica",special("stellarys","1001201"))
]},
{id:7,name:"Chirpi",elements:["Vento"],habitats:["Campos de Nimbus","Estreito Argênteo","Crista da Presa Bestial","Bosque Relâmpago"],forms:[
bf("007","Chirpi",avatar("chirpi")),
mkForm("007","Forma das Terras Altas","regional","Campos de Nimbus",form("chirpi",3)),
mkForm("007","Forma da Praia","regional","Estreito Argênteo",form("chirpi",2))
]},
{id:11,name:"Iris",elements:["Planta"],habitats:["Mar de Flores"],forms:[
bf("011","Iris",avatar("iris")),
mkForm("011","Forma das Terras Altas","regional","Mar de Flores",form("iris",2)),
mkForm("011","Forma da Floresta","regional","Mar de Flores",form("iris",3)),
mkForm("011","Forma da Campina","regional","Mar de Flores",form("iris",4)),
mkForm("011","Forma da Floresta Montanhosa","regional","Mar de Flores",form("iris",5)),
mkForm("011","Forma do Planalto","regional","Mar de Flores",form("iris",6)),
pf("011","Iris",form("iris",7))
]},
{id:27,name:"Sparki",elements:["Fogo"],habitats:["Campos de Nimbus","Crista da Presa Bestial","Bosque Relâmpago"],forms:[
bf("027","Sparki",avatar("sparki")),
mkForm("027","Forma das Terras Altas","regional","Campos de Nimbus",form("sparki",2)),
mkForm("027","Forma da Floresta","regional","Bosque Relâmpago",form("sparki",3)),
mkForm("027","Forma do Mar de Flores","regional","Mar de Flores",form("sparki",4))
]}
];

const allElements=["Fogo","Água","Planta","Sombrio","Vento","Terra","Gelo","Raio"];
const allHabitats=Object.keys(habitatClimate);
let capturedForms=JSON.parse(localStorage.getItem('aniidex-captures')||'{}');
let selectedForms=JSON.parse(localStorage.getItem('aniidex-selected')||'{}');
let currentElement='all';
let currentHabitat='all';
let searchTerm='';

function save(){localStorage.setItem('aniidex-captures',JSON.stringify(capturedForms));localStorage.setItem('aniidex-selected',JSON.stringify(selectedForms))}
function toggleForm(formId){capturedForms[formId]=!capturedForms[formId];save();render()}
function selectForm(aniimoId,formId){selectedForms[aniimoId]=formId;save();render()}

function getFiltered(){return aniimos.filter(a=>{if(searchTerm&&!a.name.toLowerCase().includes(searchTerm.toLowerCase()))return false;if(currentElement!=='all'&&!a.elements.includes(currentElement))return false;if(currentHabitat!=='all'&&!a.habitats.includes(currentHabitat))return false;return true})}

function render(){
const totalCaptured=Object.values(capturedForms).filter(Boolean).length;
const totalForms=aniimos.reduce((a,b)=>a+b.forms.length,0);
const pct=totalForms>0?Math.round((totalCaptured/totalForms)*100):0;
document.getElementById('stats').innerHTML=`<div class="stat-card indigo"><div class="stat-number">${aniimos.length}</div><div class="stat-label">Aniimos no Dex</div></div><div class="stat-card emerald"><div class="stat-number">${totalCaptured}</div><div class="stat-label">Formas Capturadas</div></div><div class="stat-card rose"><div class="stat-number">${pct}%</div><div class="stat-label">Progresso</div></div>`;

const filtered=getFiltered();
const grid=document.getElementById('grid');
grid.innerHTML=filtered.map(a=>{
const cc=a.forms.filter(f=>capturedForms[f.id]).length;
const tf=a.forms.length;
const complete=cc===tf;
const hasCap=cc>0;
const selFormId=selectedForms[a.id]||a.forms[0].id;
const selForm=a.forms.find(f=>f.id===selFormId)||a.forms[0];
const currentImage=selForm.image;

return`<div class="card ${complete?'complete':hasCap?'captured':''}">
<div class="card-header">
<div class="card-badges">
<span class="badge badge-id">#${String(a.id).padStart(3,'0')}</span>
${a.elements.map(e=>`<span class="badge badge-element" style="background:${elementColors[e]}20;color:${elementColors[e]};border-color:${elementColors[e]}40">${e}</span>`).join('')}
${complete?'<span class="star">★</span>':''}
</div>
<div class="card-name">${a.name}</div>
<div class="progress-bar"><div class="progress-track"><div class="progress-fill ${complete?'complete':'partial'}" style="width:${(cc/tf)*100}%"></div></div><span class="progress-text">${cc}/${tf}</span></div>
</div>
<div class="card-image">
<div class="image-wrapper ${hasCap?'':'uncaptured'}">
<img src="${currentImage}" alt="${a.name}" loading="lazy" onerror="this.src='${a.forms[0].image}'">
${!hasCap?'<div class="image-overlay"><span>Não capturado</span></div>':''}
<div class="form-label">${selForm.name}</div>
</div>
</div>
<div class="card-forms">
<button class="forms-toggle" onclick="this.classList.toggle('expanded');this.nextElementSibling.classList.toggle('show')">
<span>Formas (${cc}/${tf})</span>
<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
</button>
<div class="forms-list">
${a.forms.map(f=>{
const cap=capturedForms[f.id]||false;
const sel=selectedForms[a.id]===f.id;
const fc=f.category==='prismana'?'#A855F7':f.category==='climatica'?'#06B6D4':'#10B981';
const catLabel=f.category==='basica'?'Base':f.category==='prismana'?'Prismana':f.category==='climatica'?'Clima':'Região';
return`<div class="form-item ${cap?'captured':''} ${sel?'selected':''}">
<div class="form-header">
<label class="checkbox-wrapper" onclick="event.stopPropagation()"><input type="checkbox" ${cap?'checked':''} onchange="toggleForm('${f.id}')"><div class="checkbox-custom"><svg width="12" height="12" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div></label>
<span class="form-name" onclick="selectForm(${a.id},'${f.id}')">${f.name}</span>
<span class="form-category" style="background:${fc}20;color:${fc};border-color:${fc}40">${catLabel}</span>
<button class="view-btn" onclick="selectForm(${a.id},'${f.id}')">Ver</button>
</div>
${(f.region||f.climate)?`<div class="form-info">${f.region?`<span class="form-tag">📍 ${f.region}</span>`:''}${f.climate?`<span class="form-tag">${f.climateIcon} ${f.climate}</span>`:''}</div>`:''}
</div>`}).join('')}
</div>
</div>
</div>`}).join('');
}

// Initialize filters
const filtersDiv=document.getElementById('element-filters');
filtersDiv.innerHTML=`<button class="filter-btn active" onclick="setElement('all',this)">Todos</button>`+allElements.map(e=>`<button class="filter-btn" onclick="setElement('${e}',this)">${e}</button>`).join('');

const habitatSelect=document.getElementById('habitat-filter');
habitatSelect.innerHTML='<option value="all">Todas as Regiões</option>'+allHabitats.map(h=>`<option value="${h}">${h}</option>`).join('');
habitatSelect.onchange=function(){currentHabitat=this.value;render()};

document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value;render()});

function setElement(el,btn){
currentElement=el;
document.querySelectorAll('#element-filters .filter-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(el!=='all'){btn.style.background=`${elementColors[el]}20`;btn.style.borderColor=`${elementColors[el]}60`;btn.style.color=elementColors[el]}
else{btn.style.background='';btn.style.borderColor='';btn.style.color=''}
render()
}

render();
</script>
</body>
</html>
